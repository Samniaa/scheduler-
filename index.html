<script>
const MI=(y,m)=>y*12+m-1,MA=i=>[Math.floor(i/12),i%12+1];

function hrs(m,d){const o=m.d[d]||{};if(!o.s)return 0;if(o.h!==undefined&&o.h!==""&&!isNaN(f(o.h)))return f(o.h);const s=m.set;return o.s==="D"?mod(s.de-s.ds):o.s==="N"?mod(s.ne-s.ns):0}

const rideOf=(m,d)=>{const r=(m.d[d]||{}).r||0;return r*(wdOf(d)>=5?m.set.re:m.set.rw)};

const SUN=`<circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>`,MOON=`<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z" fill="currentColor"/>`,CAR=`<path d="M5 17H3v-5l2-5h14l2 5v5h-2M3 12h18M9 17h6"/><circle cx="7" cy="17" r="1.6"/><circle cx="17" cy="17" r="1.6"/>`,CMT=`<path d="M4 5h16v11H9l-5 4z"/>`,HOME=`<path d="M3 11.5L12 4l9 7.5M5.5 10v10h13V10M10 20v-5.5h4V20"/>`;
